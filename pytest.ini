[pytest]
# ocr-service/ là repo con riêng (dependency, venv, test suite riêng - chạy bằng
# "cd ocr-service && pytest"). Không có testpaths, pytest ở gốc repo tự động thu
# thập mọi test_*.py bên dưới, kể cả ocr-service/tests - vốn import PIL/paddleocr
# không có trong requirements.txt của MediCheck nên collection sẽ lỗi ngay.
testpaths = tests
norecursedirs = ocr-service .venv node_modules frontend
