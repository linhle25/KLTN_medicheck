name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        # DATABASE_URL: xem comment tuong ung trong cd.yml
        run: |
          rm -f ci_test.db
          pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          # get_llm() (src/services/llm.py) doc DEEPSEEK_API_KEY, khong phai
          # OPENAI_API_KEY - thieu bien nay se loi "Missing credentials".
          DEEPSEEK_API_KEY: test-key
          DATABASE_URL: sqlite:///./ci_test.db
          DATABASE_URL_FACTS: ""
