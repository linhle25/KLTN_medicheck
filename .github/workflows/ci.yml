name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medicheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        # DATABASE_URL: Postgres service container o tren (rieng cho CI, xa production).
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          # get_llm() (src/services/llm.py) doc DEEPSEEK_API_KEY, khong phai
          # OPENAI_API_KEY - thieu bien nay se loi "Missing credentials".
          DEEPSEEK_API_KEY: test-key
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/medicheck_test
          DATABASE_URL_FACTS: ""
