name: Keep-alive

# Supabase free tu pause project sau ~7 ngay khong hoat dong. Workflow nay goi
# /health/db (co SELECT 1 that) 2 lan/tuan de giu project Active.
# Can tao Repository variable APP_URL (Settings > Secrets and variables > Actions >
# Variables), vi du: https://medicheck.onrender.com  (khong co dau / o cuoi).
on:
  schedule:
    - cron: "0 3 * * 1,4"   # 10:00 sang thu 2 va thu 5 (gio VN)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Thieu repository variable APP_URL" >&2
            exit 1
          fi
          # Render free co the dang ngu: cho phep cold start lau + thu lai.
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 30 --retry-all-errors \
            --max-time 120 "$APP_URL/health/db"
