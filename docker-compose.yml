

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    ports:
      - "3000:3000"
    environment:
      # Frontend gọi API bằng đường dẫn tương đối (lib/api.ts: API_URL = ""), Next
      # rewrite /api/* sang biến này Ở PHÍA SERVER - tức từ bên trong container
      # frontend, nơi localhost:8000 là chính nó chứ không phải backend. Phải dùng
      # tên service trong mạng compose, để "localhost" thì mọi lệnh gọi API đều
      # ECONNREFUSED và trình duyệt nhận 500. Chạy tay ngoài docker thì next.config
      # tự lùi về http://localhost:8000, vẫn đúng.
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend
    restart: unless-stopped
